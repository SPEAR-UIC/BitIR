extends:
- ../bitir.yml
- ../fault_models.yml
- ../machines/aurora.yml
methodology:
  default_campaign: toy
  float_abs_tol: 1e-5
  float_rel_tol: 0.0
run:
  machine: aurora
  campaign: toy
  fault_model: aurora_toy_float_8
  execution_mode: write-script
fault_models:
  aurora_toy_float_8:
    selection_mode: instruction_result
    phase: float
    int_float_only: 1
    include_constants: 0
    max_injections: 8
    run_baseline: 1
    skip_existing: 0
    trace_level: full
    trace_source_window: 8
campaigns:
  toy:
    benchmarks:
    - assert
machines:
  aurora:
    build_dir: bitir/build/sycl-aurora-toy
    golden_root: Aurora_Sycl_Golden_Outputs_toy
    results_root: bitir/results/llvm17_inject_toy
benchmarks:
  assert:
    compare_mode: text
    golden_file: assert.txt
    source_dirs:
      sycl: src/assert-sycl
