extends:
- ../bitir.yml
- ../fault_models.yml
- ../machines/frontier.yml
methodology:
  default_campaign: toy
  float_abs_tol: 1e-5
  float_rel_tol: 0.0
run:
  machine: frontier
  campaign: toy
  fault_model: frontier_toy_float_8
  execution_mode: write-script
fault_models:
  frontier_toy_float_8:
    selection_mode: instruction_result
    phase: float
    int_float_only: 1
    include_constants: 0
    max_injections: 8
    run_baseline: 1
    skip_existing: 0
    trace_level: full
    trace_source_window: 8
campaigns:
  toy:
    benchmarks:
    - layout
machines:
  frontier:
    build_dir: bitir/build/hip-frontier-toy
    golden_root: Frontier_HIP_Golden_Outputs_toy
    results_root: bitir/results/llvm17_inject_amd_toy
benchmarks:
  layout:
    compare_mode: exact
    golden_file: layout.bin
    args:
    - '{LAYOUT_REPEAT}'
    env:
      LAYOUT_REPEAT: '1'
    source_dirs:
      hip: src/layout-hip
