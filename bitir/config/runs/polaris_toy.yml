extends:
- ../bitir.yml
- ../fault_models.yml
- ../machines/polaris.yml
methodology:
  default_campaign: toy
  float_abs_tol: 1e-5
  float_rel_tol: 0.0
run:
  machine: polaris
  campaign: toy
  fault_model: polaris_toy_pointer_8
  execution_mode: write-script
fault_models:
  polaris_toy_pointer_8:
    selection_mode: instruction_pointer
    phase: pointer
    max_injections: 8
    run_baseline: 1
    skip_existing: 0
    trace_level: full
    trace_source_window: 8
  polaris_toy_float_8:
    selection_mode: instruction_result
    phase: float
    int_float_only: 1
    include_constants: 0
    max_injections: 8
    run_baseline: 1
    skip_existing: 0
    trace_level: full
    trace_source_window: 8
campaigns:
  toy:
    benchmarks:
    - colorwheel
machines:
  polaris:
    build_dir: bitir/build/cuda-polaris-toy
    golden_root: Polaris_Golden_Outputs_toy
    results_root: bitir/results/llvm17_inject_toy
    jobs:
      build:
        header:
        - '#PBS -N bitir_{machine}_{task}'
        - '#PBS -A {ADD ACCOUNT HERE}'
        - '#PBS -q debug'
        - '#PBS -l select=1:ncpus=8:ngpus=1:mem=32gb'
        - '#PBS -l filesystems=home:eagle'
        - '#PBS -l walltime=00:20:00'
        - '#PBS -o OUT_{machine}_{task}_{bench}_{stamp}_{index}.out'
        - '#PBS -j oe'
      golden:
        header:
        - '#PBS -N bitir_{machine}_{task}'
        - '#PBS -A {ADD ACCOUNT HERE}'
        - '#PBS -q debug'
        - '#PBS -l select=1:ncpus=8:ngpus=1:mem=32gb'
        - '#PBS -l filesystems=home:eagle'
        - '#PBS -l walltime=00:20:00'
        - '#PBS -o OUT_{machine}_{task}_{bench}_{stamp}_{index}.out'
        - '#PBS -j oe'
      baseline:
        header:
        - '#PBS -N bitir_{machine}_{task}'
        - '#PBS -A {ADD ACCOUNT HERE}'
        - '#PBS -q debug'
        - '#PBS -l select=1:ncpus=8:ngpus=1:mem=32gb'
        - '#PBS -l filesystems=home:eagle'
        - '#PBS -l walltime=00:30:00'
        - '#PBS -o OUT_{machine}_{task}_{bench}_{stamp}_{index}.out'
        - '#PBS -j oe'
      inject_one:
        header:
        - '#PBS -N bitir_{machine}_{task}'
        - '#PBS -A {ADD ACCOUNT HERE}'
        - '#PBS -q debug'
        - '#PBS -l select=1:ncpus=8:ngpus=1:mem=32gb'
        - '#PBS -l filesystems=home:eagle'
        - '#PBS -l walltime=00:30:00'
        - '#PBS -o OUT_{machine}_{task}_{bench}_{stamp}_{index}.out'
        - '#PBS -j oe'
      deploy:
        header:
        - '#PBS -N bitir_{machine}_{task}'
        - '#PBS -A {ADD ACCOUNT HERE}'
        - '#PBS -q debug'
        - '#PBS -l select=1:ncpus=8:ngpus=1:mem=32gb'
        - '#PBS -l filesystems=home:eagle'
        - '#PBS -l walltime=01:00:00'
        - '#PBS -o OUT_{machine}_{task}_{bench}_{stamp}_{index}.out'
        - '#PBS -j oe'
benchmarks:
  colorwheel:
    args:
    - "1"
    - "32"
    - "1"
    compare_mode: text
    golden_file: colorwheel.txt
    status:
      pass_regex: "\\bPASS\\b"
      fail_regex: "\\bFAIL\\b|Usage:"
    source_dirs:
      cuda: src/colorwheel-cuda
