extends: ../bitir.yml

campaigns:
  debug_trace_top10:
    benchmarks:
      - entropy
      - layout
      - randomAccess

fault_models:
  debug_trace_top10:
    inject_target: result
    phase: float
    int_float_only: 1
    include_constants: 0
    keep_dumps: 1
    run_baseline: 1
    skip_existing: 0
    missing_only: 0
    worklist_queue: 0
    trace_level: full
    trace_source_window: 12
    trace_repeats: 2
    results_subdir_base: debug_trace_top10/nvidia
    runtime_env:
      CUDA_LAUNCH_BLOCKING: "1"

benchmarks:
  entropy:
    env:
      ENTROPY_WIDTH: "10000"
      ENTROPY_HEIGHT: "1024"
      ENTROPY_REPEAT: "1"
      BITIR_SITE_LIST: HeCBench/config/sites/debug_trace_top10_nvidia_entropy.csv

  layout:
    env:
      LAYOUT_REPEAT: "1"
      BITIR_SITE_LIST: HeCBench/config/sites/debug_trace_top10_nvidia_layout.csv

  randomAccess:
    env:
      RANDOMACCESS_REPEAT: "1"
      BITIR_SITE_LIST: HeCBench/config/sites/debug_trace_top10_nvidia_randomAccess.csv

run:
  machine: nvidia
  campaign: debug_trace_top10
  fault_model: debug_trace_top10
  execution_mode: write-script
