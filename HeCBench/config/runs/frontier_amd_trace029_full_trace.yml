extends: ../bitir.yml

fault_models:
  trace029_full:
    inject_target: result
    phase: float
    int_float_only: 1
    include_constants: 0
    keep_dumps: 1
    run_baseline: 1
    skip_existing: 0
    missing_only: 0
    worklist_queue: 0
    trace_level: full
    trace_source_window: 12
    results_subdir_base: trace029/amd

benchmarks:
  pathfinder:
    env:
      PATHFINDER_COLS: "10000"
      PATHFINDER_ROWS: "1000"
      PATHFINDER_PYRAMID: "5"

machines:
  amd:
    golden_root: Frontier_HIP_Golden_Outputs
    runtime_home: /opt/rocm-6.4.2
    llvm_search_root: /opt/rocm-6.4.2/lib/llvm
    tool_search_roots:
      - /opt/rocm-6.4.2/lib/llvm/bin
    modules:
      - rocm/6.4.2
      - rocm-llvm-toolchain
    task_scripts:
      inject_one: HeCBench/tools/llvm17_inject/run_benchmark_injection.sh

run:
  machine: amd
  task: inject-one
  fault_model: trace029_full
  execution_mode: write-script
