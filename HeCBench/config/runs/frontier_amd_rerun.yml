extends: ../bitir.yml

fault_models:
  amd_rerun_result:
    inject_target: result
    phase: float
    int_float_only: 1
    include_constants: 0
    keep_dumps: 1
    run_baseline: 0
    skip_existing: 0
    missing_only: 0
    worklist_queue: 0
    trace_level: off

machines:
  amd:
    golden_root: Frontier_HIP_Golden_Outputs
    runtime_home: /opt/rocm-6.4.2
    llvm_search_root: /opt/rocm-6.4.2/lib/llvm
    tool_search_roots:
      - /opt/rocm-6.4.2/lib/llvm/bin
    modules:
      - rocm/6.4.2
      - rocm-llvm-toolchain
    task_scripts:
      inject_one: HeCBench/tools/llvm17_inject/run_benchmark_injection.sh

run:
  machine: amd
  task: inject-one
  fault_model: amd_rerun_result
  execution_mode: write-script
