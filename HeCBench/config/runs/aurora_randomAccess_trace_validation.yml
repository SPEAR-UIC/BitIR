extends: ../bitir.yml

campaigns:
  randomaccess_trace_validation:
    benchmarks:
      - randomAccess

fault_models:
  trace_probe:
    inject_target: result
    phase: float
    int_float_only: 1
    include_constants: 0
    keep_dumps: 1
    run_baseline: 1
    skip_existing: 0
    missing_only: 0
    worklist_queue: 0
    trace_level: full
    trace_source_window: 12
    trace_repeats: 3
    results_subdir_base: llvm17_inject_trace_probe
    runtime_env:
      SYCL_PI_TRACE: "2"
      UR_L0_DEBUG: "1"

benchmarks:
  randomAccess:
    env:
      RANDOMACCESS_REPEAT: "1"
      BITIR_SITE_LIST: HeCBench/config/sites/aurora_randomAccess_trace_validation_site56_bit2.csv

machines:
  intel:
    build_dir: HeCBench/build/sycl-intel-aurora-trace
    golden_root: Aurora_Sycl_Golden_Outputs_trace
    jobs:
      build:
        stdout: OUT_aurora_trace_build.out
        stderr: ERROR_aurora_trace_build.err
      golden:
        stdout: OUT_aurora_trace_golden.out
        stderr: ERROR_aurora_trace_golden.err
      deploy:
        stdout: OUT_aurora_trace_deploy.out
        stderr: ERROR_aurora_trace_deploy.err

run:
  machine: intel
  campaign: randomaccess_trace_validation
  fault_model: trace_probe
  execution_mode: write-script
