extends: ../bitir.yml

campaigns:
  toy:
    benchmarks:
      - ace
      - wordcount

fault_models:
  toy50:
    inject_target: result
    phase: float
    int_float_only: 1
    include_constants: 0
    max_pairs: 50
    max_injections: 50
    run_baseline: 1
    skip_existing: 0
    missing_only: 0
    worklist_queue: 0
    results_subdir_base: llvm17_inject_toy

benchmarks:
  ace:
    compare_mode: text
    source_dirs:
      nvidia: HeCBench/src/ace-cuda
    golden_file: ace.txt
    args:
      - "{ACE_STEPS}"
    env:
      ACE_STEPS: "100"
    status:
      pass_line: PASS
      fail_line: FAIL

  wordcount:
    compare_mode: text
    source_dirs:
      nvidia: HeCBench/src/wordcount-cuda
    golden_file: wordcount.txt
    args:
      - "{WORDCOUNT_REPEAT}"
    env:
      WORDCOUNT_REPEAT: "10"
    status:
      pass_line: PASS
      fail_line: FAIL

machines:
  nvidia:
    build_dir: HeCBench/build-cuda118-toy-clean
    golden_root: Polaris_Golden_Outputs_toy
    jobs:
      build:
        account: UIC-HPC
        queue: debug
        select: 1:ncpus=8:ngpus=1:mem=32gb
        filesystems: home:eagle
        walltime: 00:10:00
        stdout: OUT_toy_build_clean.out
        stderr: ERROR_toy_build_clean.err
      golden:
        account: UIC-HPC
        queue: debug
        select: 1:ncpus=8:ngpus=1:mem=32gb
        filesystems: home:eagle
        walltime: 00:10:00
        stdout: OUT_toy_build_clean.out
        stderr: ERROR_toy_build_clean.err
      deploy:
        account: UIC-HPC
        queue: debug
        select: 1:ncpus=8:ngpus=1:mem=32gb
        filesystems: home:eagle
        walltime: 01:00:00
        stdout: OUT_toy_deploy.out
        stderr: ERROR_toy_deploy.err

run:
  machine: nvidia
  campaign: toy
  fault_model: toy50
  execution_mode: write-script
