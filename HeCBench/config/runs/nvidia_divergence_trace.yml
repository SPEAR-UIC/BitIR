extends: ../bitir.yml

campaigns:
  divergence_trace:
    benchmarks:
      - entropy
      - layout
      - matrix-rotate
      - randomAccess

fault_models:
  trace_probe:
    inject_target: result
    phase: float
    int_float_only: 1
    include_constants: 0
    keep_dumps: 1
    run_baseline: 1
    skip_existing: 0
    missing_only: 0
    worklist_queue: 0
    trace_level: full
    trace_source_window: 12
    trace_repeats: 3
    results_subdir_base: llvm17_inject_trace_probe

benchmarks:
  entropy:
    compare_mode: exact
    source_dirs:
      nvidia: HeCBench/src/entropy-cuda
    golden_file: entropy.bin
    args:
      - "{ENTROPY_WIDTH}"
      - "{ENTROPY_HEIGHT}"
      - "{ENTROPY_REPEAT}"
    env:
      ENTROPY_WIDTH: "256"
      ENTROPY_HEIGHT: "256"
      ENTROPY_REPEAT: "1"
      BITIR_SITE_LIST: HeCBench/config/sites/entropy_trace_cases.csv

  layout:
    compare_mode: exact
    source_dirs:
      nvidia: HeCBench/src/layout-cuda
    golden_file: layout.bin
    args: []
    env:
      BITIR_SITE_LIST: HeCBench/config/sites/layout_trace_cases.csv

  matrix-rotate:
    compare_mode: float
    source_dirs:
      nvidia: HeCBench/src/matrix-rotate-cuda
    golden_file: matrix-rotate.bin
    args:
      - "{MATRIX_ROTATE_SIZE}"
      - "{MATRIX_ROTATE_REPEAT}"
    env:
      MATRIX_ROTATE_SIZE: "256"
      MATRIX_ROTATE_REPEAT: "1"
      BITIR_SITE_LIST: HeCBench/config/sites/matrix_rotate_trace_cases.csv

  randomAccess:
    compare_mode: exact
    source_dirs:
      nvidia: HeCBench/src/randomAccess-cuda
    golden_file: randomAccess.bin
    args: []
    env:
      BITIR_SITE_LIST: HeCBench/config/sites/randomAccess_trace_cases.csv

machines:
  nvidia:
    build_dir: HeCBench/build-cuda118-trace
    golden_root: Polaris_Golden_Outputs_trace
    jobs:
      build:
        account: UIC-HPC
        queue: debug
        select: 1:ncpus=8:ngpus=1:mem=32gb
        filesystems: home:eagle
        walltime: 00:20:00
        stdout: OUT_trace_build.out
        stderr: ERROR_trace_build.err
      golden:
        account: UIC-HPC
        queue: debug
        select: 1:ncpus=8:ngpus=1:mem=32gb
        filesystems: home:eagle
        walltime: 00:20:00
        stdout: OUT_trace_golden.out
        stderr: ERROR_trace_golden.err
      deploy:
        account: UIC-HPC
        queue: debug
        select: 1:ncpus=8:ngpus=1:mem=32gb
        filesystems: home:eagle
        walltime: 00:45:00
        stdout: OUT_trace_deploy.out
        stderr: ERROR_trace_deploy.err

run:
  machine: nvidia
  campaign: divergence_trace
  fault_model: trace_probe
  execution_mode: write-script
